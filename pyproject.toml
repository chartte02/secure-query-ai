[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-query-ai"
version = "0.1.0"
description = "A local, non-executing AI SQL generation security demo with reproducible PostgreSQL fixtures"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "sqlglot==28.6.0",
  "uvicorn==0.40.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
namespaces = false

[tool.setuptools.package-data]
app = ["prompt_templates/*.txt"]

[tool.pytest.ini_options]
addopts = "-q -ra -p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "ollama: requires a locally installed Ollama model",
  "database: requires initialized local Docker PostgreSQL lab",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
